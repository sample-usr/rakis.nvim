# rakis-light theme for tmux
# Source in your tmux.conf:
#   source-file path/to/rakis.conf
set -g mode-style "fg=#f2e7cf,bg=#8b5e04"
set -g message-style "fg=#4c3424,bg=#dccab2"
set -g message-command-style "fg=#4c3424,bg=#dccab2"

set -g pane-border-style "fg=#dccab2"
set -g pane-active-border-style "fg=#a3420a"

set -g status-style "fg=#6e5749,bg=#e7d9c0"
set -g status-left "#[fg=#f2e7cf,bg=#a3420a,bold] #S "
set -g status-right "#[fg=#6e5749,bg=#e7d9c0] %Y-%m-%d %H:%M #[fg=#f2e7cf,bg=#a3420a,bold] #h "

set -g window-status-format "#[fg=#6e5749,bg=#e7d9c0] #I #W "
set -g window-status-current-format "#[fg=#4c3424,bg=#dccab2,bold] #I #W "
set -g window-status-separator ""
set -g window-status-activity-style "fg=#8b5e04,bg=#e7d9c0"
set -g window-status-bell-style "fg=#aa181d,bg=#e7d9c0"

set -g clock-mode-colour "#a3420a"
set -g copy-mode-match-style "fg=#f2e7cf,bg=#6e5749"
set -g copy-mode-current-match-style "fg=#f2e7cf,bg=#8b5e04"
